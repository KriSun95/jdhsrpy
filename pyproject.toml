[project]
name = "jdhsrpy"
version = "0.1.0"
description = "Software used for Jessie Duncan's HSR project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
            "setuptools",
            "numpy",
            "scipy",
            "matplotlib",
            "sunpy",
            "nustar-pysolar",
            "sunkit-spex==0.5.0",
            "corner>=2.3.0",
            "emcee>=3.1.6",
            "nestle>=0.2.1",
            "numdifftools>=0.11.1",
            "reproject>=0.21.0",
            "mpl-animators>=1.2.4",
            "lxml>=6.1.3",
            "zeep>=4.3.3",
            "drms>=0.9.1",
            "aiapy>=0.12.1",
            "scikit-image>=0.26.0",
]

[tool.uv.sources]
nustar-pysolar = { git = "https://github.com/NuSTAR/nustar_pysolar.git" }
