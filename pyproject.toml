[project]
name = "jdhsrpy"
version = "0.1.0"
description = "Software used for Jessie Duncan's HSR project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
            "setuptools",
            "numpy",
            "scipy",
            "matplotlib",
            "sunpy",
            "nustar-pysolar",
            "sunkit-spex==0.5.0",
            "corner>=2.3.0",
            "emcee>=3.1.6",
            "nestle>=0.2.1",
            "numdifftools>=0.11.1",
]

[tool.uv.sources]
nustar-pysolar = { git = "https://github.com/NuSTAR/nustar_pysolar.git" }
