[project]
name = "jdhsrpy"
version = "0.1.0"
description = "Software used for Jessie Duncan's HSR project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
            "setuptools",
            "numpy",
            "scipy",
            "matplotlib",
            "sunpy",
            "nustar-pysolar",
            "sunkit-spex==0.5.0",
            "corner>=2.3.0",
            "emcee>=3.1.6",
            "nestle>=0.2.1",
            "numdifftools>=0.11.1",
            "reproject>=0.21.0",
            "mpl-animators>=1.2.4",
            "lxml>=6.1.3",
            "zeep>=4.3.3",
            "drms>=0.9.1",
            "aiapy>=0.12.1",
            "scikit-image>=0.26.0",
            "pre-commit>=4.6.2",
            "pip",
            "sphinx>=9.1.0",
            "sphinxemoji>=0.3.2",
            "sphinx-gallery>=0.22.1",
            "myst-parser>=5.1.0",
            "sphinx-rtd-theme>=3.1.0",
            "shapely>=2.2.0",
]

[tool.uv.sources]
nustar-pysolar = { git = "https://github.com/KriSun95/nustar_pysolar.git", branch = "fix-ephem-download" }
